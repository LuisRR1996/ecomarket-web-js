<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoMarket | Inicio</title>

    <!-- Enlace a Bootstrap CSS para el diseño responsivo -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Enlace a Bootstrap Icons (Para las redes sociales) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Enlace a tu archivo CSS personalizado -->
    <link rel="stylesheet" href="src/css/estilos.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- CABECERA -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
            <div class="container">

                <!-- Logo de EcoMarket -->
                <a class="navbar-brand" href="index.html">
                    <img src="src/img/Logo_EcoMarket.jpeg" alt="Logo de EcoMarket" height="60"
                        style="border-radius: 8px;">
                </a>

                <!-- Botón 'hamburguesa' para celulares -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Menú de Navegación -->
                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active fw-bold" href="index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="pages/Página_de_Productos.html">Productos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="pages/Página_de_Contacto.html">Contacto</a>
                        </li>
                    </ul>

                    <!-- Ícono del Carrito con el Contador -->
                    <div class="d-flex align-items-center">
                        <span class="fs-4 me-2">🛒</span>
                        <span id="contador-carrito" class="badge bg-success rounded-pill fs-6">0</span>
                    </div>
                </div>

            </div>
        </nav>
    </header>

    <!-- SECCIÓN PRINCIPAL (HERO) -->
    <main class="flex-grow-1">
        <section class="hero-section d-flex align-items-center justify-content-center text-center">
            <div class="container hero-content p-5">
                <h1 class="display-4 fw-bold text-white mb-4">Lo mejor de la naturaleza en tu mesa</h1>
                <!-- Botón secundario en el hero -->
                <a href="#destacados" class="btn btn-light btn-lg px-5 py-3 fw-bold rounded-pill shadow">Comprar
                    ahora</a>
            </div>
        </section>

        <!-- SECCIÓN DE PRODUCTOS DESTACADOS -->
        <section id="destacados" class="container py-5 text-center">
            <div class="row g-4 justify-content-center mb-5">

                <!-- Producto 1 -->
                <div class="col-md-4">
                    <!-- Aquí agregamos la clase "tarjeta-producto" para animarla en CSS -->
                    <div class="card h-100 border-0 shadow-sm tarjeta-producto">
                        <img src="src/img/Producto 1.png" class="card-img-top p-3" alt="Tomates Cherry">
                        <div class="card-body">
                            <h5 class="card-title fw-bold">Tomates Cherry</h5>
                            <p class="card-text text-success fw-bold fs-5">$4.50</p>
                            <button id="btn-prod-1"
                                class="btn btn-outline-success btn-sm rounded-pill px-4 fw-bold">Agregar al
                                carrito</button>
                        </div>
                    </div>
                </div>

                <!-- Producto 2 -->
                <div class="col-md-4">
                    <div class="card h-100 border-0 shadow-sm tarjeta-producto">
                        <img src="src/img/Producto 2.png" class="card-img-top p-3" alt="Espinaca Fresca">
                        <div class="card-body">
                            <h5 class="card-title fw-bold">Espinaca Fresca</h5>
                            <p class="card-text text-success fw-bold fs-5">$2.80</p>
                            <button id="btn-prod-2"
                                class="btn btn-outline-success btn-sm rounded-pill px-4 fw-bold">Agregar al
                                carrito</button>
                        </div>
                    </div>
                </div>

                <!-- Producto 3 -->
                <div class="col-md-4">
                    <div class="card h-100 border-0 shadow-sm tarjeta-producto">
                        <img src="src/img/Producto 3.png" class="card-img-top p-3" alt="Miel Artesanal">
                        <div class="card-body">
                            <h5 class="card-title fw-bold">Miel Artesanal</h5>
                            <p class="card-text text-success fw-bold fs-5">$8.00</p>
                            <button id="btn-prod-3"
                                class="btn btn-outline-success btn-sm rounded-pill px-4 fw-bold">Agregar al
                                carrito</button>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Botón principal para ir al catálogo completo -->
            <a href="pages/Página_de_Productos.html"
                class="btn btn-success btn-lg px-5 py-3 fw-bold rounded-pill shadow-sm">Ver catálogo completo</a>
        </section>
    </main>

    <!-- PIE DE PÁGINA (FOOTER) -->
    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <div class="container">
            <!-- Íconos de Redes Sociales -->
            <div class="mb-3">
                <!-- La clase 'bi bi-facebook' llama al ícono exacto -->
                <a href="#" class="text-white me-3 fs-4 text-decoration-none"><i class="bi bi-facebook"></i></a>
                <a href="#" class="text-white me-3 fs-4 text-decoration-none"><i class="bi bi-instagram"></i></a>
                <a href="#" class="text-white fs-4 text-decoration-none"><i class="bi bi-tiktok"></i></a>
            </div>
            <p class="mb-0">© 2026 EcoMarket - Todos los derechos reservados</p>
        </div>
    </footer>

    <!-- Enlace a Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Archivo JavaScript -->
    <script src="src/js/script.js"></script>
</body>

</html>
